name: build-sim-searxng

services:
  searxng:
    image: docker.io/searxng/searxng@sha256:11a9b34cdc0b1ec2b991470a2762ecb5a1a531898289fb51dcd015260450729e
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SEARXNG_SECRET: "${SEARXNG_SECRET:?SEARXNG_SECRET must be supplied at runtime}"
      SEARXNG_BASE_URL: "http://127.0.0.1:8080/"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
